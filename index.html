<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kazi Minhazul Islam - SQA Engineer Portfolio</title>
<style>
body { font-family: 'Inter', Arial, sans-serif; margin:0; padding:0; background:#0f172a; color:#e2e8f0; }
header { background: linear-gradient(90deg,#0ea5e9,#6366f1); color:white; padding:40px 20px; text-align:center; }
header h1 { margin:0; font-size:40px; }
header p { margin-top:10px; font-size:18px; }
.container { max-width:1000px; margin:40px auto; background:#1e293b; padding:30px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.4);}
h2 { color:#38bdf8; border-bottom:2px solid #334155; padding-bottom:5px; }
.section { margin-bottom:40px; }
ul { list-style:none; padding-left:0; }
li { background:#334155; margin-bottom:10px; padding:10px; border-radius:6px; }
a { color:#38bdf8; text-decoration:none; }
a:hover { text-decoration:underline; }
.contact-info p { font-size:16px; }
.pagination { display:flex; justify-content:center; margin-top:20px; gap:8px; }
.page-btn { background:#334155; color:#e2e8f0; padding:8px 12px; border:none; border-radius:6px; cursor:pointer; }
.page-btn.active { background:#38bdf8; color:#021; }
</style>
</head>
<body>

<header>
    <h1>Kazi Minhazul Islam</h1>
    <p>SQA Engineer | 3+ Years Experience</p>
</header>

<div class="container">
    <section class="section">
        <h2>Projects</h2>
        <ul id="project-list"></ul>
        <div class="pagination" id="pagination"></div>
    </section>
</div>

<footer style="text-align:center; color:#94a3b8; padding:20px; font-size:14px;">
    © <span id="year"></span> Kazi Minhazul Islam — All Rights Reserved.
</footer>

<script>
// List of projects
const projects = [
    { title: "Attendance App", description: "Web-based application for attendance tracking." },
    { title: "Card Payment System", description: "Secure online card payment solution." },
    { title: "Remittance Software", description: "Money transfer system for remittances." },
    { title: "Bill Collection Software", description: "Application for managing bill collections." },
    { title: "Offshore Banking Software", description: "Banking software for offshore operations." },
    { title: "Case Management System", description: "Web-based platform for case tracking." },
    { title: "User Request Management System", description: "Web-based system for managing user requests." },
    { title: "New Project 1", description: "Description for project 1." },
    { title: "New Project 2", description: "Description for project 2." },
    { title: "New Project 3", description: "Description for project 3." }
];

const projectsPerPage = 3;
let currentPage = 1;

function displayProjects(page) {
    const start = (page-1) * projectsPerPage;
    const end = start + projectsPerPage;
    const paginatedProjects = projects.slice(start, end);

    const projectList = document.getElementById('project-list');
    projectList.innerHTML = "";
    paginatedProjects.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${p.title}:</strong> ${p.description}`;
        projectList.appendChild(li);
    });

    setupPagination();
}

function setupPagination() {
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = "";
    const pageCount = Math.ceil(projects.length / projectsPerPage);

    for(let i=1; i<=pageCount; i++){
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (i===currentPage ? ' active' : '');
        btn.textContent = i;
        btn.addEventListener('click', () => {
            currentPage = i;
            displayProjects(currentPage);
        });
        pagination.appendChild(btn);
    }
}

// Initialize
displayProjects(currentPage);
document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
